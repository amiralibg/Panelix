name: Android Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore and write signing config
        working-directory: Android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > panelix-release.jks
          cat > keystore.properties <<EOF
          storeFile=$(pwd)/panelix-release.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Stage APK for release
        run: |
          APK=$(find Android/app/build/outputs/apk/release -name "*-release.apk" | head -1)
          cp "$APK" "Panelix-${{ github.ref_name }}.apk"

      - name: Remove signing secrets
        if: always()
        working-directory: Android
        run: rm -f panelix-release.jks keystore.properties

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Panelix ${{ github.ref_name }}"
          files: "Panelix-${{ github.ref_name }}.apk"
          generate_release_notes: true
