name: Android Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Sign APK
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

          APK=$(find Android/app/build/outputs/apk/release -name "*.apk" | head -1)

          # Pick the newest apksigner from whichever build-tools version is installed
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name "apksigner" | sort -rV | head -1)

          "$APKSIGNER" sign \
            --ks keystore.jks \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.ANDROID_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out "Panelix-${{ github.ref_name }}.apk" \
            "$APK"

          rm keystore.jks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Panelix ${{ github.ref_name }}"
          files: "Panelix-${{ github.ref_name }}.apk"
          generate_release_notes: true
